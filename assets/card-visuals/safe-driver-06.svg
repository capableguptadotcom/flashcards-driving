  <title id="title-safe-driver-06">Both ears disappear — Do not cover both ears while driving</title>
  <rect width="640" height="295" fill="#234b3f"/><path d="M0 240Q320 120 640 240V295H0Z" fill="#3d4240"/>
        <rect x="225" y="32" width="190" height="228" rx="25" fill="#fff9ea" stroke="#bd4e3a" stroke-width="10"/>
